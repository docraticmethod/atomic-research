services:
  # v3.2: INPUT is the live OpenAlex client, not mounted fixtures. The container
  # needs outbound egress to api.openalex.org (default bridge networking provides
  # it — do NOT set network_mode: none). .env is mounted (not baked); public/ is
  # the OUTPUT surface the pipeline writes and the dashboard serves.
  pipeline:
    build: .
    command: npm run run:pipeline
    environment:
      - LINKED_AUTHOR_ID=${LINKED_AUTHOR_ID:-}
    volumes:
      - ./.env:/app/.env:ro
      - ./public:/app/public

  dashboard:
    build: .
    command: npm run start:dash
    ports:
      - "4000:4000"
    volumes:
      - ./.env:/app/.env:ro
      - ./public:/app/public
